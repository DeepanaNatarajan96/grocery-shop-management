<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Your Cart — GreenBasket</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/mobile.css" />
</head>
<body>
  <header id="site-header"></header>

  <section class="page-header">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> / Cart</div>
      <h2>Your Shopping Cart</h2>
      <p>Review your items and check out securely.</p>
    </div>
  </section>

  <main class="container section" id="cart-view">
    <div class="cart-layout">
      <div class="card" id="cart-items-card">
        <div class="flex-between" style="margin-bottom: 10px;">
          <h3 class="mt-0">Cart Items</h3>
          <button type="button" class="btn btn-outline btn-sm" id="clear-cart-btn">Clear Cart</button>
        </div>
        <div id="cart-items-list"></div>
      </div>

      <div class="card">
        <h3 class="mt-0">Order Summary</h3>
        <div class="summary-row"><span>Subtotal</span><span id="sum-subtotal">₹0.00</span></div>
        <div class="summary-row"><span>Estimated Tax (5%)</span><span id="sum-tax">₹0.00</span></div>
        <div class="summary-row"><span>Discount</span><span id="sum-discount">₹0.00</span></div>
        <div class="summary-row total"><span>Total</span><span id="sum-total">₹0.00</span></div>

        <button type="button" class="btn btn-primary btn-block" id="checkout-btn" style="margin-top:16px;">
          Proceed to Checkout
        </button>
        <p class="field-hint" style="margin-top:8px;">A flat ₹50 discount applies on orders above ₹1000.</p>
      </div>
    </div>
  </main>

  <!-- Checkout modal -->
  <div class="modal-backdrop" id="checkout-modal">
    <div class="modal">
      <div class="modal-head">
        <h3 class="mt-0">Checkout</h3>
        <button type="button" class="modal-close" id="close-checkout-modal">&times;</button>
      </div>
      <form id="checkout-form">
        <div class="form-grid">
          <div class="form-field">
            <label for="cust-name">Full Name</label>
            <input type="text" id="cust-name" required />
          </div>
          <div class="form-field">
            <label for="cust-phone">Phone Number</label>
            <input type="text" id="cust-phone" required placeholder="e.g. 9876543210" />
          </div>
          <div class="form-field">
            <label for="cust-email">Email (optional)</label>
            <input type="email" id="cust-email" />
          </div>
          <div class="form-field">
            <label for="cust-address">Address (optional)</label>
            <input type="text" id="cust-address" />
          </div>
        </div>
        <p class="field-error" id="checkout-error"></p>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-block" id="place-order-btn">Place Order</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bill / receipt modal -->
  <div class="modal-backdrop" id="bill-modal">
    <div class="modal">
      <div class="modal-head">
        <h3 class="mt-0">Order Confirmed 🎉</h3>
        <button type="button" class="modal-close" id="close-bill-modal">&times;</button>
      </div>
      <div id="bill-content"></div>
      <div class="form-actions">
        <button type="button" class="btn btn-primary btn-block" id="continue-shopping-btn">Continue Shopping</button>
      </div>
    </div>
  </div>

  <footer id="site-footer"></footer>

  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
